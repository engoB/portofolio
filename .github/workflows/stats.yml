name: Rapport de visites hebdomadaire

on:
  schedule:
    - cron: '7 7 * * 1' # chaque lundi vers 9 h (heure de Paris)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rapport GoatCounter → issue
        run: node scripts/stats-report.mjs
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
