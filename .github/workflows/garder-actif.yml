name: Garder les tâches programmées actives

# GitHub met en pause les tâches programmées d'un dépôt public après 60 jours sans commit.
# Ce petit commit mensuel (une date dans un fichier) évite que la publication des billets
# programmés et le rapport de visites s'arrêtent si vous ne touchez pas au site pendant un moment.
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%d > .github/derniere-activite.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/derniere-activite.txt
          git commit -m "Activité mensuelle (garde les tâches programmées actives)" || exit 0
          git push
